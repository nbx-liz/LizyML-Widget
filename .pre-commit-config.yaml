repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # managed-by: claude-code-config (.githooks/pre-commit runs through pre-commit)
  - repo: local
    hooks:
      - id: claude-code-config-protected-commit
        name: protected local commit (claude-code-config)
        entry: .githooks/pre-commit
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
